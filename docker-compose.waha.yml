# OPCIONAL — WAHA como provedor alternativo de WhatsApp.
# O padrão do CRM é o WPP Engine (sem Docker).
# Uso: WHATSAPP_PROVIDER=waha WAHA_URL=http://localhost:3001
#      docker compose -f docker-compose.waha.yml up -d
services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-http://host.docker.internal:3000/api/whatsapp/webhook}
      WHATSAPP_HOOK_EVENTS: message,session.status
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - waha_data:/app/.sessions

volumes:
  waha_data:
