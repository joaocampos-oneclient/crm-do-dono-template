# WhatsApp via WAHA (QR code). Opcional — o CRM roda sem isso.
# Uso rápido: docker compose up -d
# Depois: WAHA_URL=http://localhost:3001 no .env.local
services:
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-http://host.docker.internal:3000/api/whatsapp}
      WHATSAPP_HOOK_EVENTS: message,session.status
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    volumes:
      - waha_data:/app/.sessions

volumes:
  waha_data:
